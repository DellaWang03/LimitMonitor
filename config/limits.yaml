# 限额配置文件
# ================================================================================
# 基于 Excel 数据分析提取的限额参数
# 更新日期: 2026-01-19

# 1. 单一债券限额
single_bond:
  # 规模限额（万元）
  scale_limit: null  # 从配置表动态读取
  
  # 集中度限额
  concentration_limit: null  # 从配置表动态读取
  
  # 特批限额（白名单）
  special_approval: []  # 从配置表动态读取

# 2. 单一主体限额
single_issuer:
  # 规模限额（万元）
  scale_limit: null  # 从配置表动态读取
  
  # 计算方式
  calculation_method: "按发行人wind代码汇总"

# 3. 单一实控人限额
single_controller:
  # 规模限额（万元）
  scale_limit: null  # 从配置表动态读取
  
  # 穿透方式
  mapping_source: "调整实控人名单"
  
  # 取最高额度（多业务线）
  use_max_limit: true
  
  # 特殊处理
  special_cases:
    beijing_state_capital:
      name: "北京国有资本"
      separate_calculation: true

# 4. 单一担保人限额
single_guarantor:
  # 规模限额（万元）
  scale_limit: 40000
  
  # 业务分类
  business_types:
    - "做市业务"
    - "自营业务"

# 5. 地域集中度限额
regional_concentration:
  # 单一地域总持仓限额（占公司净资产比例）
  total_limit_ratio: 0.20  # 20%
  
  # 单一地域城投持仓限额（占公司净资产比例）
  chengtou_limit_ratio: 0.10  # 10%
  
  # 计算基数
  base: "公司净资产"
  
  # 地域分类字段
  region_field: "省份"

# 6. 高风险行业限额
high_risk_industry:
  # 总持仓限额（占信用债总持仓比例）
  total_limit_ratio: 0.10  # 10%
  
  # 计算基数
  base: "信用债总持仓"
  
  # 高风险行业列表（从配置表动态读取）
  industry_list: []  # 待从数据中提取
  
  # 行业分类字段
  industry_field: "行业分类"

# 7. 高风险省份限额
high_risk_province:
  # 总持仓限额（占公司净资产比例）
  total_limit_ratio: 0.10  # 10%
  
  # 计算基数
  base: "公司净资产"
  
  # 高风险省份列表（从配置表动态读取）
  province_list: []  # 待从数据中提取
  
  # 省份字段
  province_field: "省份"

# 8. 新老划断
new_old_cutoff:
  # 判断标准
  cutoff_date: null  # 从新老划断表动态读取
  
  # 新老债券标记
  enabled: true
  
  # 源表
  source_table: "新老划断"

# 9. 高收益债券
high_yield:
  # 穿透计算
  penetration_enabled: true
  
  # 高收益标准（待确认）
  yield_threshold: null

# 基数配置
base_values:
  # 公司净资产（万元）
  net_assets:
    source: "公司净资产_手工_每日"
    field: "公司净资产(万)"
    latest_value: 1376251  # 2026-01-19 数据
    
  # 信用债总持仓（万元）
  credit_bond_total:
    calculation: "sum(债券余额) where 债券类型 = 信用债"
    latest_value: 1342946  # 2026-01-19 数据

# 告警阈值
alert_thresholds:
  critical: 0.95  # 95% 时严重告警
  warning: 0.90   # 90% 时预警
  info: 0.80      # 80% 时提示

# 例外情况配置
exceptions:
  # 特批债券/主体（不受限额限制）
  approved_exceptions: []
  
  # 临时调整（有效期）
  temporary_adjustments: []

# 计算规则
calculation_rules:
  # 汇总方式
  aggregation:
    bond_level: "按主证券代码"
    issuer_level: "按债务主体wind代码"
    controller_level: "按调整后实际控制人"
    guarantor_level: "按授信担保公司名称"
    region_level: "按省份"
    industry_level: "按行业分类"
    
  # 关联方式
  joins:
    bond_to_issuer: "left join on 债务主体wind代码"
    issuer_to_controller: "left join on 主体wind代码"
    bond_to_pool: "left join on 债券代码"

# 字段映射（Excel 列名 → 标准字段名）
field_mappings:
  bond_code: "主证券代码"
  bond_name: "证券名称"
  bond_balance: "债券余额(亿)"
  issuer_code: "债务主体wind代码"
  issuer_name: "债务主体"
  controller_name: "调整后实际控制人"
  guarantor_name: "授信担保公司名称"
  region: "省份"
  industry: "行业分类"
  holding_amount: "库存数量"
